name: SePay read-only connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bank API without exposing financial data
        env:
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
        run: node scripts/check-sepay.mjs
